<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>Sunlight over open ground</title>

  <!-- Halo. -->
  <circle cx="300" cy="186" r="150" fill="#763A1D" opacity="0.08" />
  <circle cx="300" cy="186" r="112" fill="#763A1D" opacity="0.10" />

  <!-- Rays, alternating long and short so the ring reads as light rather
       than as a gear or a compass. -->
  <g stroke="#763A1D" stroke-width="10" stroke-linecap="round">
    <path d="M300 30 V 66" />
    <path d="M300 306 V 342" />
    <path d="M144 186 H 180" />
    <path d="M420 186 H 456" />
    <path d="M190 76  L 215 101" />
    <path d="M385 271 L 410 296" />
    <path d="M410 76  L 385 101" />
    <path d="M215 271 L 190 296" />
  </g>
  <g stroke="#763A1D" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M243 44  L 255 78" />
    <path d="M345 294 L 357 328" />
    <path d="M357 44  L 345 78" />
    <path d="M255 294 L 243 328" />
    <path d="M158 129 L 192 141" />
    <path d="M408 231 L 442 243" />
    <path d="M442 129 L 408 141" />
    <path d="M192 231 L 158 243" />
  </g>

  <!-- The sun itself. -->
  <circle cx="300" cy="186" r="72" fill="#763A1D" />
  <circle cx="300" cy="186" r="72" fill="none" stroke="#FAF6EF" stroke-width="3" />

  <!-- Ground. -->
  <path d="M40 356 C 160 336, 250 344, 300 348 C 380 354, 470 340, 560 352"
        fill="none" stroke="#2F4A37" stroke-width="11" stroke-linecap="round" />
  <path d="M84 380 C 210 366, 380 368, 516 378"
        fill="none" stroke="#2F4A37" stroke-width="7" stroke-linecap="round" opacity="0.4" />
</svg>
