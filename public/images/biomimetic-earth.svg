<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>Earth emitting its natural electromagnetic pulses</title>

  <!-- The site's only planet-emitting-outward diagram. It was kept deliberately
       distinct from mimics-earth-field.svg, a side-by-side comparison of two
       field shapes; that file was deleted on 2026-08-27 when /pemf's band moved
       to a photograph, so the distinction no longer has to be defended -- but
       the rule behind it stands: two near-identical planet diagrams on one site
       read as a mistake. /pemf already carries three. -->

  <!-- Pulses radiating outward, fading with distance. -->
  <g fill="none" stroke="#2F4A37" stroke-linecap="round">
    <circle cx="400" cy="250" r="122" stroke-width="6" opacity="0.72" />
    <circle cx="400" cy="250" r="164" stroke-width="5.5" opacity="0.52" />
    <circle cx="400" cy="250" r="206" stroke-width="5" opacity="0.34" />
    <circle cx="400" cy="250" r="248" stroke-width="4.5" opacity="0.2" />
  </g>

  <!-- A few pulses picked out in clay so the emission reads as active rather
       than as static rings. -->
  <g fill="none" stroke="#763A1D" stroke-linecap="round" stroke-width="6">
    <path d="M486 160 A 122 122 0 0 1 520 250" opacity="0.9" />
    <path d="M282 338 A 122 122 0 0 1 350 372" opacity="0.7" />
    <path d="M520 122 A 164 164 0 0 1 562 226" opacity="0.6" />
  </g>

  <!-- Earth. -->
  <circle cx="400" cy="250" r="84" fill="#2F4A37" />
  <circle cx="400" cy="250" r="84" fill="none" stroke="#FAF6EF" stroke-width="4" />
  <path d="M362 214 C 388 228, 378 250, 402 260 C 424 269, 416 292, 392 300"
        fill="none" stroke="#FAF6EF" stroke-width="6" stroke-linecap="round" opacity="0.72" />
  <path d="M430 216 C 450 230, 444 254, 426 266"
        fill="none" stroke="#FAF6EF" stroke-width="6" stroke-linecap="round" opacity="0.5" />
</svg>
