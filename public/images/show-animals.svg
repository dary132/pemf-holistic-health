<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360">
  <title>A horse, a dog and a cat</title>

  <!-- Heads rather than full bodies: at the size this renders inside TriPanel,
       a head is recognisable where a whole animal becomes a smudge. The
       replaced file was a cartoon zoo collage captioned "PEMF is good 4 us",
       which matched neither the panel's title nor the photographs beside it. -->

  <!-- Horse. -->
  <g fill="#2F4A37">
    <path d="M116 108 L 126 54 L 156 88 Z" />
    <path d="M204 108 L 194 54 L 164 88 Z" opacity="0.75" />
    <path d="M114 118 C 114 88, 206 88, 206 118 L 202 172
             C 198 200, 186 216, 176 226 C 168 234, 152 234, 144 226
             C 134 216, 122 200, 118 172 Z" />
    <ellipse cx="160" cy="232" rx="34" ry="24" />
  </g>
  <circle cx="148" cy="230" r="5" fill="#FAF6EF" />
  <circle cx="172" cy="230" r="5" fill="#FAF6EF" />
  <circle cx="132" cy="142" r="7.5" fill="#FAF6EF" />
  <circle cx="188" cy="142" r="7.5" fill="#FAF6EF" />
  <text x="158" y="316" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="26" fill="#2A2E27" text-anchor="middle">Horses</text>

  <!-- Dog: same head mass, with dropped ears. -->
  <g fill="#2F4A37">
    <path d="M266 118 C 250 118, 244 152, 250 186 C 254 208, 268 214, 276 206 Z" opacity="0.75" />
    <path d="M394 118 C 410 118, 416 152, 410 186 C 406 208, 392 214, 384 206 Z" opacity="0.75" />
    <path d="M276 120 C 276 92, 384 92, 384 120 L 384 178
             C 384 216, 356 244, 330 244 C 304 244, 276 216, 276 178 Z" />
    <ellipse cx="330" cy="222" rx="24" ry="18" />
  </g>
  <circle cx="304" cy="156" r="7.5" fill="#FAF6EF" />
  <circle cx="356" cy="156" r="7.5" fill="#FAF6EF" />
  <circle cx="330" cy="214" r="6" fill="#FAF6EF" />
  <text x="330" y="316" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="26" fill="#2A2E27" text-anchor="middle">Dogs</text>

  <!-- Cat: pointed ears, narrower jaw. -->
  <g fill="#2F4A37">
    <path d="M462 128 L 470 68 L 512 106 Z" />
    <path d="M582 128 L 574 68 L 532 106 Z" opacity="0.75" />
    <path d="M466 132 C 466 104, 578 104, 578 132 L 578 176
             C 578 214, 550 240, 522 240 C 494 240, 466 214, 466 176 Z" />
  </g>
  <circle cx="498" cy="164" r="7.5" fill="#FAF6EF" />
  <circle cx="546" cy="164" r="7.5" fill="#FAF6EF" />
  <path d="M522 194 L 514 204 M522 194 L 530 204" stroke="#FAF6EF"
        stroke-width="5" stroke-linecap="round" fill="none" />
  <g stroke="#FAF6EF" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M490 200 H 462" />
    <path d="M554 200 H 582" />
  </g>
  <text x="522" y="316" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="26" fill="#2A2E27" text-anchor="middle">Cats</text>
</svg>
