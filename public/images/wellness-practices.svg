<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560">
  <title>Wellness practices grouped as physical, mental and emotional</title>

  <!-- Three domains, four practices each, keeping the content of the twelve-cell
       illustration it replaces. The domain headings are set large enough to stay
       readable at the ~380px this renders at inside TriPanel and Card; the
       individual practices are secondary detail, and the alt text carries the
       full list for anyone who cannot resolve them. -->

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">

    <rect x="20" y="24" width="720" height="160" rx="20" fill="#2F4A37" opacity="0.09" />
    <circle cx="72" cy="104" r="26" fill="#2F4A37" />
    <text x="118" y="86" font-size="34" font-weight="700" fill="#2A2E27">Physical</text>
    <text x="118" y="130" font-size="27" fill="#2A2E27" opacity="0.85">Restorative sleep · Nourishing foods</text>
    <text x="118" y="164" font-size="27" fill="#2A2E27" opacity="0.85">Hydration · Movement and exercise</text>

    <rect x="20" y="200" width="720" height="160" rx="20" fill="#763A1D" opacity="0.09" />
    <circle cx="72" cy="280" r="26" fill="#763A1D" />
    <text x="118" y="262" font-size="34" font-weight="700" fill="#2A2E27">Mental</text>
    <text x="118" y="306" font-size="27" fill="#2A2E27" opacity="0.85">Practicing gratitude · Time in nature</text>
    <text x="118" y="340" font-size="27" fill="#2A2E27" opacity="0.85">Meaningful connections · Mindful presence</text>

    <rect x="20" y="376" width="720" height="160" rx="20" fill="#2F4A37" opacity="0.09" />
    <circle cx="72" cy="456" r="26" fill="#2F4A37" opacity="0.62" />
    <text x="118" y="438" font-size="34" font-weight="700" fill="#2A2E27">Emotional</text>
    <text x="118" y="482" font-size="27" fill="#2A2E27" opacity="0.85">Supportive relationships · Intentional rest</text>
    <text x="118" y="516" font-size="27" fill="#2A2E27" opacity="0.85">Personal growth · Inner reflection</text>

  </g>
</svg>
