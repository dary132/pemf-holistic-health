<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>The radiation spectrum from low energy to high energy</title>
  <defs>
    <marker id="sr-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2A2E27" />
    </marker>
  </defs>

  <!-- Seven bands, low energy to high. Sage carries the non-ionizing half and
       clay the ionizing half, so the split is visible without introducing a
       hue that is not already in the palette, and without relying on a
       red/green pairing that colour-blind readers cannot separate. -->
  <g>
    <rect x="60"    y="190" width="68.6" height="46" fill="#2F4A37" opacity="0.22" />
    <rect x="128.6" y="190" width="68.6" height="46" fill="#2F4A37" opacity="0.36" />
    <rect x="197.1" y="190" width="68.6" height="46" fill="#2F4A37" opacity="0.52" />
    <rect x="265.7" y="190" width="68.6" height="46" fill="#2F4A37" opacity="0.70" />
    <rect x="334.3" y="190" width="68.6" height="46" fill="#763A1D" opacity="0.58" />
    <rect x="402.9" y="190" width="68.6" height="46" fill="#763A1D" opacity="0.78" />
    <rect x="471.4" y="190" width="68.6" height="46" fill="#763A1D" opacity="1" />
  </g>
  <rect x="60" y="190" width="480" height="46" fill="none"
        stroke="#2A2E27" stroke-width="3" />

  <!-- The ionizing threshold. -->
  <path d="M334.3 174 V 252" stroke="#2A2E27" stroke-width="4" stroke-linecap="round" />

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif"
     font-size="20" fill="#2A2E27" text-anchor="middle">
    <text x="94"  y="176">Radio</text>
    <text x="231" y="176">Infrared</text>
    <text x="369" y="176">UV</text>
    <text x="506" y="176">Gamma</text>
    <text x="163" y="264">Microwave</text>
    <text x="300" y="264">Visible</text>
    <text x="437" y="264">X-ray</text>
  </g>

  <!-- Energy axis. -->
  <path d="M60 316 H 540" stroke="#2A2E27" stroke-width="3"
        stroke-linecap="round" marker-end="url(#sr-arrow)" opacity="0.8" />
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif"
     font-size="19" fill="#2A2E27" opacity="0.85">
    <text x="60"  y="348">Low energy</text>
    <text x="540" y="348" text-anchor="end">High energy</text>
  </g>
</svg>
