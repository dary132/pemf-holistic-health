<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>Earth's magnetic field lines running between the magnetic poles</title>

  <circle cx="300" cy="200" r="152" fill="#2F4A37" opacity="0.07" />

  <!-- Dipole loops. Drawn far wider than the planet on purpose: when the loops
       are close to the planet's own radius they read as concentric circles
       instead of as lines leaving one pole and returning to the other. -->
  <g fill="none" stroke="#2F4A37" stroke-linecap="round">
    <path d="M300 148 C 216  92, 208 308, 300 252" stroke-width="9" opacity="0.9" />
    <path d="M300 148 C 140  54, 130 346, 300 252" stroke-width="8" opacity="0.62" />
    <path d="M300 148 C  56  14,  44 386, 300 252" stroke-width="7" opacity="0.36" />
    <path d="M300 148 C 384  92, 392 308, 300 252" stroke-width="9" opacity="0.9" />
    <path d="M300 148 C 460  54, 470 346, 300 252" stroke-width="8" opacity="0.62" />
    <path d="M300 148 C 544  14, 556 386, 300 252" stroke-width="7" opacity="0.36" />
  </g>

  <!-- Magnetic axis. -->
  <path d="M300 104 V 296" stroke="#763A1D" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="12 11" opacity="0.7" />

  <!-- Earth. -->
  <circle cx="300" cy="200" r="62" fill="#2F4A37" />
  <circle cx="300" cy="200" r="62" fill="none" stroke="#FAF6EF" stroke-width="4" />
  <path d="M278 180 C 294 189, 288 203, 302 209 C 314 214, 310 228, 296 232"
        fill="none" stroke="#FAF6EF" stroke-width="4" stroke-linecap="round" opacity="0.7" />

  <!-- Poles. -->
  <circle cx="300" cy="148" r="12" fill="#763A1D" />
  <circle cx="300" cy="252" r="12" fill="#763A1D" />
</svg>
