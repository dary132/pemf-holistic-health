<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>A magnet's north and south poles and its field lines</title>
  <defs>
    <marker id="mp-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F4A37" />
    </marker>
  </defs>

  <!-- Field lines: out of the north end, around the outside of the magnet,
       and back in at the south end. Arrowheads land on the south end so the
       direction of travel is unambiguous. -->
  <g fill="none" stroke="#2F4A37" stroke-linecap="round" marker-end="url(#mp-arrow)">
    <path d="M234 184 C 190 126, 410 126, 364 184" stroke-width="4.5" opacity="0.85" />
    <path d="M230 176 C 120  66, 480  66, 368 176" stroke-width="4" opacity="0.55" />
    <path d="M226 168 C  34   6, 566   6, 372 168" stroke-width="3.5" opacity="0.3" />
    <path d="M234 216 C 190 274, 410 274, 364 216" stroke-width="4.5" opacity="0.85" />
    <path d="M230 224 C 120 334, 480 334, 368 224" stroke-width="4" opacity="0.55" />
    <path d="M226 232 C  34 394, 566 394, 372 232" stroke-width="3.5" opacity="0.3" />
  </g>

  <!-- The bar magnet. North in clay, south in sage: the two site colours
       already carry a warm/cool distinction, so no new hue is introduced,
       and neither pole depends on red/green to be told apart. -->
  <rect x="234" y="170" width="66" height="60" rx="6" fill="#763A1D" />
  <rect x="300" y="170" width="66" height="60" rx="6" fill="#2F4A37" />
  <rect x="234" y="170" width="132" height="60" rx="6"
        fill="none" stroke="#2A2E27" stroke-width="4" />

  <text x="267" y="211" text-anchor="middle" font-size="30" font-weight="700"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#FAF6EF">N</text>
  <text x="333" y="211" text-anchor="middle" font-size="30" font-weight="700"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#FAF6EF">S</text>
</svg>
